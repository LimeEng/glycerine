on: [push, pull_request, workflow_dispatch]

name: CI

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          for file in ./*.sh; do
            [ -e "$file" ] || continue
            shellcheck -x "$file"
          done
